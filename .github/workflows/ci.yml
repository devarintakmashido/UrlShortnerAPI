name: Spring Boot CI Pipeline

# 1. When should this robot run? Every time we push to main!
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    # 2. What kind of computer should GitHub spin up in the cloud?
    runs-on: ubuntu-latest

    steps:
      # 3. Download our code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4. Install Java 21 on the cloud computer
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 5. Compile the app! (We skip tests here so it doesn't crash looking for your local MySQL database)
      - name: Build Project with Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests