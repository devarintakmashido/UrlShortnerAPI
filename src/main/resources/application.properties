# 1. Database Connection (Make sure to change your password!)
spring.datasource.url=jdbc:mysql://localhost:3306/url_shortener_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=_my_sql

# 2. Hibernate / JPA Settings (Automatically creates your url_link table)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Redis Cache Configuration (Default local settings)
spring.data.redis.host=localhost
spring.data.redis.port=6379